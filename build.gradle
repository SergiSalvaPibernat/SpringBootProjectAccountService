plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.web'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Selenium WebDriver dependencies - Updated to compatible versions
	testImplementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
	testImplementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.25.0'
	testImplementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.25.0'
	testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'
	testImplementation 'org.testcontainers:selenium:1.19.3'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.3'

}

tasks.named('test') {
	useJUnitPlatform()
}
