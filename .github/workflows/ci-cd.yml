name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, AcServiceNewURL ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run tests
      run: ./gradlew test
      
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: build/test-results/test/*.xml
        github_token: ${{ secrets.GITHUB_TOKEN }}
        check_name: 'Test Results'
        comment_mode: always
        
    - name: Upload test results (fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/test-results/test/*.xml
          build/reports/tests/test/
        
  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build Application
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build application
      run: ./gradlew build -x test
      
    - name: Get version from build.gradle
      id: version
      run: |
        VERSION=$(./gradlew properties -q | grep "version:" | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Application version: $VERSION"
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/*.jar
        retention-days: 30
        
  docker:
    runs-on: ubuntu-latest
    needs: build
    name: Build Docker Image
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: |
          accountservice:latest
          accountservice:${{ needs.build.outputs.version }}
          accountservice:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test Docker image
      run: |
        echo "Testing Docker image..."
        
        # Verify image was built
        if ! docker images | grep accountservice; then
          echo "❌ Docker image 'accountservice' not found locally"
          docker images
          exit 1
        fi
        
        echo "✅ Docker image found locally"
        docker images accountservice
        
        # Start container in background with health checks
        echo "Starting container..."
        docker run -d --name test-container -p 8081:8081 \
          --health-cmd="curl -f http://localhost:8081/account/ || exit 1" \
          --health-interval=30s \
          --health-timeout=10s \
          --health-retries=3 \
          accountservice:latest
        
        # Wait for container to start and become healthy
        echo "Waiting for container to start..."
        sleep 15
        
        # Check if container is running
        if docker ps | grep test-container; then
          echo "✅ Container is running successfully"
          echo "Container status:"
          docker ps --filter "name=test-container"
          echo "Container logs:"
          docker logs test-container
          
          # Try basic connectivity test (optional, may not work in GitHub Actions without curl)
          echo "Testing connectivity (if possible)..."
          if command -v curl >/dev/null 2>&1; then
            if curl -f http://localhost:8081/account/ --connect-timeout 5 --max-time 10; then
              echo "✅ HTTP endpoint accessible"
            else
              echo "⚠️ HTTP endpoint not accessible (may be normal in CI environment)"
            fi
          else
            echo "ℹ️ curl not available, skipping connectivity test"
          fi
        else
          echo "❌ Container failed to start"
          echo "Container logs:"
          docker logs test-container 2>&1 || echo "No logs available"
          echo "Docker process list:"
          docker ps -a
          exit 1
        fi
        
        # Cleanup
        echo "Cleaning up..."
        docker stop test-container || true
        docker rm test-container || true
        
    - name: Save Docker image as artifact
      if: github.event_name != 'pull_request'
      run: |
        docker save accountservice:${{ needs.build.outputs.version }} | gzip > accountservice-${{ needs.build.outputs.version }}.tar.gz
        
    - name: Upload Docker image artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: accountservice-${{ needs.build.outputs.version }}.tar.gz
        retention-days: 7
        
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    name: Security Scan
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: jar-artifact
        path: build/libs/
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: accountservice:scan
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'accountservice:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'