name: Quick Build

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for faster build'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'

permissions:
  contents: read
  actions: write

jobs:
  quick-build:
    runs-on: ubuntu-latest
    name: Quick JAR Build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build JAR with optional tests
      run: |
        if [ "${{ github.event.inputs.skip_tests }}" = "false" ]; then
          echo "Running with tests..."
          ./gradlew clean test bootJar
        else
          echo "Skipping tests for faster build..."
          ./gradlew clean bootJar -x test
        fi
      
    - name: Verify and list generated files
      run: |
        echo "Generated files in build/libs/:"
        ls -la build/libs/
        
        if [ -f build/libs/AccountService-0.0.1-SNAPSHOT.jar ]; then
          echo "✅ JAR successfully created"
          echo "File size: $(du -h build/libs/AccountService-0.0.1-SNAPSHOT.jar | cut -f1)"
        else
          echo "❌ JAR file not found!"
          exit 1
        fi
      
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: quick-jar-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 5
        
    - name: Build summary
      run: |
        echo "🚀 Quick build completed!"
        echo "📦 JAR artifact: AccountService-0.0.1-SNAPSHOT.jar"
        echo "⏱️  Build time: $(date)"
        echo "🔧 Tests skipped: ${{ github.event.inputs.skip_tests || 'true' }}"