name: Quick Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'Dockerfile'

jobs:
  quick-build:
    runs-on: ubuntu-latest
    name: Quick JAR Build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build JAR
      run: ./gradlew bootJar
      
    - name: List generated files
      run: ls -la build/libs/
      
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: quick-jar-${{ github.sha }}
        path: build/libs/*.jar
        retention-days: 5